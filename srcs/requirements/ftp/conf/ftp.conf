listen=YES
listen_ipv6=NO
listen_port=${FTP_PORT}
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
passv_enable=YES
passv_min_port=${FTP_PASV_MIN_PORT}
passv_max_port=${FTP_PASV_MAX_PORT}
local_root=/var/www/html
seccomp_sandbox=NO
